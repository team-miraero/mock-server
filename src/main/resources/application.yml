spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.jejuro.miraero.mock_server
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:9000}

mock:
  oauth:
    authorization-code-ttl-seconds: ${MOCK_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS:300}
    access-token-ttl-seconds: ${MOCK_OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
