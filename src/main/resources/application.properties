# Common configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${SERVER_PORT:9000}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=org.jejuro.miraero.mock_server
mybatis.configuration.map-underscore-to-camel-case=true

mock.oauth.authorization-code-ttl-seconds=${MOCK_OAUTH_AUTHORIZATION_CODE_TTL_SECONDS:300}
mock.oauth.access-token-ttl-seconds=${MOCK_OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
